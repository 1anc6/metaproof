# Weekly dependency updates as pull requests, which CI checks before anything is merged.
# Minor and patch updates are grouped into one PR per ecosystem to keep the noise down.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # The API stays on Python 3.12 (as CI does): a newer Python is a deliberate move, made once
    # onnxruntime, c2pa-python and pi-heif ship wheels for it, not a weekly bump.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Deliberate upgrades, not weekly bumps: Node's types follow the Node that CI runs (22), and
    # a new TypeScript major can change what type-checks.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
