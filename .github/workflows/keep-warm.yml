name: Keep API warm

# Render's free instance sleeps after 15 idle minutes and takes ~1 minute to wake. Pinging the
# health endpoint every 14 minutes keeps demos instant. One service running all month uses
# ~744 of Render's 750 free hours. /api/health does not touch the database, so Neon can still
# scale to zero between real requests.
#
# GitHub delays scheduled runs under load (often by hours), so most pings land on a sleeping
# instance. Waking it can take longer than one request, so the ping retries for up to ~6 minutes
# and only fails if the API never answers.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ping the API
        run: >-
          curl --fail --silent --show-error --max-time 90
          --retry 4 --retry-all-errors --retry-delay 15
          https://metaproof.onrender.com/api/health
