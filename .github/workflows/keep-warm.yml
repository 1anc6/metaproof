name: Keep API warm

# Render's free instance sleeps after 15 idle minutes and takes ~1 minute to wake. Pinging the
# health endpoint every 14 minutes keeps demos instant. One service running all month uses
# ~744 of Render's 750 free hours. /api/health does not touch the database, so Neon can still
# scale to zero between real requests.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl --fail --silent --show-error --max-time 120 https://metaproof.onrender.com/api/health
