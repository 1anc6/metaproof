name: Backend

# Render deploys main by itself whenever files under backend/ change (Root Directory: backend).
# Set its Auto-Deploy to "After CI Checks Pass" so a red run here never reaches production.

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

env:
  UV_VERSION: "0.13.6"

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres with pgvector, so integration tests exercise the real queue,
    # migrations and vector search on every push.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: metaproof_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/metaproof_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "uv==$UV_VERSION"
      # --locked fails if uv.lock no longer matches pyproject.toml: run `uv lock` and commit it.
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q -rs
      # openapi.json is the contract the frontend's types come from: regenerate it after changing
      # a response model (python scripts/export_openapi.py), then run `npm run gen:api`.
      - run: uv run --no-sync python scripts/export_openapi.py && git diff --exit-code openapi.json
      # The exact versions the Docker image installs, checked against known vulnerabilities.
      - run: |
          uv export --frozen --no-dev --no-emit-project --no-header -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The image Render builds, without the 121 MB detector model (the build skips it).
      - run: docker build --build-arg DETECTOR_URL=skip -t metaproof-api .
      # Every dependency installs and imports on Linux, as the deployed API will.
      - run: docker run --rm metaproof-api python -c "import app.main"
