<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MetaProof" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5f5248" />
    <meta
      name="description"
      content="MetaProof checks an image's metadata, Content Credentials and pixels, and explains whether it looks authentic, edited or AI-generated."
    />
    <title>MetaProof — image authenticity, explained</title>
    <script>
      // Set the theme before first paint so a dark-mode visitor never sees a light flash.
      try {
        var pref = (JSON.parse(localStorage.getItem('metaproof.prefs.v1') || '{}').theme) || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0a')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
