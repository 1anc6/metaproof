[project]
name = "metaproof-backend"
version = "0.1.0"
description = "MetaProof API: evidence-based image authenticity analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pillow>=11.0",
    # Decode-only HEIC/HEIF for Pillow (LGPL libheif + libde265; no GPL x265 encoder).
    "pi-heif>=1.0",
    "filetype>=1.2",
    "c2pa-python>=0.38",
    "numpy>=2.0",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
