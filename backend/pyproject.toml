[project]
name = "metaproof-backend"
version = "0.1.0"
description = "MetaProof API: evidence-based image authenticity analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pillow>=11.0",
    # Decode-only HEIC/HEIF for Pillow (LGPL libheif + libde265; no GPL x265 encoder).
    "pi-heif>=1.0",
    "filetype>=1.2",
    "c2pa-python>=0.38",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    # Error reports, only when SENTRY_DSN is set (app/monitoring.py).
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
# uv.lock pins every dependency (Docker and CI install from it; Dependabot updates it). Some
# releases ship wheels for only a few platforms (c2pa-python 0.38.2: macOS only), so the lock
# must pick versions that install on Linux (Docker, CI) and Windows.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# Pydantic models accept a field's input form (a string for an enum, a dict for a model).
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Libraries without type hints.
module = ["c2pa.*", "onnxruntime.*", "pi_heif.*", "filetype.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
